    <text x="88.0" y="207.9" font-size="8" fill="#6B7280" text-anchor="middle">pattern C</text>
    <rect x="132.0" y="178.0" width="76.0" height="20.0" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
