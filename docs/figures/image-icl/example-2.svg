<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1F2937" stroke-linecap="round" stroke-linejoin="round">
  <title>Example 2 from the real code: a test photo between a label-1 and a label-0 photo reads back a mixed vector, about half e0 and half e1 over the photo</title>
  <g transform="translate(8 8)">
    <text x="0.0" y="17.4" font-size="15" fill="#1F2937" text-anchor="start" font-weight="bold">Example 2: t reads — a test photo between a 1-photo and a 0-photo</text>
    <text x="0.0" y="35.2" font-size="9" fill="#6B7280" text-anchor="start">LabelledRead(width 4, heads 1, layers 1, n_slots 3, max_sources 8, top_k 2); Wq = Wk = Wv = Wo = I, b = 0; LayerNorms weight 1, bias 0; E = one-hot rows e0, e1, e2; MLP zeroed. Numbers: examples.json</text>
