    <text x="542.0" y="171.4" font-size="9.5" fill="#1F2937" text-anchor="middle" font-weight="bold">c2·p2</text>
    <text x="606.0" y="171.4" font-size="9.5" fill="#1F2937" text-anchor="middle" font-weight="bold">c1·p1</text>
    <text x="670.0" y="171.4" font-size="9.5" fill="#1F2937" text-anchor="middle" font-weight="bold">c1·p2</text>
