    <text x="350.0" y="293.2" font-size="8.8" fill="#6B7280" text-anchor="start">keys and queries are LayerNormed content tokens; the values are the key photo's label embedding, repeated for its patches</text>
    <text x="350.0" y="316.0" font-size="11" fill="#1F2937" text-anchor="start" font-weight="bold">what flows back and what the photo carries out</text>
    <text x="350.0" y="339.6" font-size="10" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">patch 1:  r = 0.19 e0 + 0.81 e1</text>
    <text x="404.0" y="359.2" font-size="9" fill="#6B7280" text-anchor="end">r =</text>
    <rect x="410.0" y="346.0" width="136.0" height="20.0" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="478.0" y="359.2" font-size="9" fill="#D97706" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">+0.19  +0.81  +0.00  +0.00</text>
    <text x="650.0" y="359.2" font-size="9" fill="#6B7280" text-anchor="end">out = z + r =</text>
