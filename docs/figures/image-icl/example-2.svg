    <text x="350.0" y="431.4" font-size="9.5" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">photo average:  0.54 e0 + 0.46 e1    (then the MLP, zeroed here, and + m before the row transformer)</text>
    <rect x="0.0" y="496.0" width="884.0" height="72.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="10.0" y="513.8" font-size="10.5" fill="#D97706" text-anchor="start" font-weight="bold">what happened</text>
    <text x="10.0" y="531.6" font-size="10" fill="#1F2937" text-anchor="start">t has one patch like c1 (label 1) and one like c2 (label 0): cos 0.50 with c1 and 0.71 with c2, 0.00 with c3, so N(t) = {c2, c1}.</text>
    <text x="10.0" y="545.6" font-size="10" fill="#1F2937" text-anchor="start">Patch 1 attends mostly to c1's matching patch, patch 2 mostly to c2's: their reads are 0.81 e1 + 0.19 e0 and 0.88 e0 + 0.12 e1.</text>
    <text x="10.0" y="559.6" font-size="10" fill="#1F2937" text-anchor="start">Averaged over the photo the read is 0.54 e0 + 0.46 e1: the vote is soft, and it is per patch.</text>
  </g>
</svg>
