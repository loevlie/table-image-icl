    <text x="10.0" y="192.0" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="bold">c3</text>
    <rect x="22.0" y="180.0" width="22.0" height="16.0" rx="8.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="33.0" y="191.6" font-size="10" fill="#D97706" text-anchor="middle" font-weight="bold">1</text>
    <rect x="50.0" y="178.0" width="76.0" height="20.0" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
    <text x="88.0" y="191.2" font-size="9" fill="#2563EB" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">+1  +1  -1  -1</text>
    <text x="88.0" y="207.9" font-size="8" fill="#6B7280" text-anchor="middle">pattern A</text>
