<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1F2937" stroke-linecap="round" stroke-linejoin="round">
  <title>Example 3 from the real code: a context photo with label 0 retrieves itself and reads back mostly e0; the test photo's label is never an input</title>
  <g transform="translate(8 8)">
    <text x="0.0" y="17.4" font-size="15" fill="#1F2937" text-anchor="start" font-weight="bold">Example 3: c2 reads — a context photo reads its own label</text>
    <text x="0.0" y="35.2" font-size="9" fill="#6B7280" text-anchor="start">LabelledRead(width 4, heads 1, layers 1, n_slots 3, max_sources 8, top_k 2); Wq = Wk = Wv = Wo = I, b = 0; LayerNorms weight 1, bias 0; E = one-hot rows e0, e1, e2; MLP zeroed. Numbers: examples.json</text>
    <text x="0.0" y="60.0" font-size="11" fill="#1F2937" text-anchor="start" font-weight="bold">the table: 2-patch photos, 4-wide tokens</text>
