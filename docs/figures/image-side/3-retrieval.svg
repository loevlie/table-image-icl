    <text x="726.0" y="91.6" font-size="10" fill="#1F2937" text-anchor="middle">k = 3 drawn here; k = 32 in the model</text>
    <text x="726.0" y="106.4" font-size="9.5" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ModelConfig.patch_top_k = 32, max_sources = 256</text>
    <text x="576.0" y="143.5" font-size="9.8" fill="#1F2937" text-anchor="start">what retrieval does and does not do:</text>
    <text x="576.0" y="157.0" font-size="9.8" fill="#1F2937" text-anchor="start">• no weights: the mean, two normalisations, one matmul, topk</text>
    <text x="576.0" y="170.5" font-size="9.8" fill="#1F2937" text-anchor="start">• runs once per table on the stage's input tokens, before layer 1</text>
    <text x="576.0" y="184.0" font-size="9.8" fill="#1F2937" text-anchor="start">• runs only when there are more than k sources; with ≤ 32</text>
    <text x="576.0" y="197.5" font-size="9.8" fill="#1F2937" text-anchor="start">  context photos every source is read (nearest = None)</text>
    <text x="576.0" y="211.0" font-size="9.8" fill="#1F2937" text-anchor="start">• a context photo retrieves itself, so it will read its own label</text>
    <text x="576.0" y="224.5" font-size="9.8" fill="#1F2937" text-anchor="start">• the attention a photo faces is then the same size for any</text>
    <text x="576.0" y="238.0" font-size="9.8" fill="#1F2937" text-anchor="start">  context, which is what lets a model trained on 256-row</text>
    <text x="576.0" y="251.5" font-size="9.8" fill="#1F2937" text-anchor="start">  tables be scored on 10,000-row ones</text>
    <rect x="0.0" y="328.0" width="884.0" height="30.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <text x="12.0" y="347.1" font-size="11.5" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">m_i = (1/256) Σ_p z_{i,p} ;   s_ij = cos(m_i, m_j), j ∈ context ;   N(i) = top-k_j s_ij   (k = 32)</text>
    <text x="0.0" y="398.3" font-size="12" fill="#6B7280" text-anchor="start">Retrieval is by content only: no label is used to pick the neighbours; it costs one 128-dimensional dot product per pair.</text>
  </g>
</svg>
