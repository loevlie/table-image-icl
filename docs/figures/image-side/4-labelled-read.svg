    <rect x="0.0" y="312.0" width="884.0" height="46.0" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <text x="12.0" y="331.1" font-size="11.5" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">q = LN_q(z_i),   k_j = LN_k(z_j) for j ∈ N(i),   v_{j,p} = e_{y_j} for every patch p of photo j</text>
    <text x="12.0" y="347.1" font-size="11.5" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">r_i = softmax(q kᵀ / √d) v ;   z_i ← z_i + r_i ;   z_i ← z_i + MLP(LN z_i)     (two such layers; keys = stage input both times)</text>
    <text x="0.0" y="398.3" font-size="12" fill="#6B7280" text-anchor="start">A soft nearest-neighbour vote per patch. A context photo reads its own label too; a test photo is never a source, so it cannot read its own.</text>
  </g>
</svg>
